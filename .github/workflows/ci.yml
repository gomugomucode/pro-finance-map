name: Ledgerly CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  web-ci:
    name: Ledgerly Web - Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ledgerly-web/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd ledgerly-web
          npm ci

      - name: Run Web Linting
        run: |
          cd ledgerly-web
          npm run lint

      - name: Run Web Tests
        run: |
          cd ledgerly-web
          npm test

      - name: Run Web Production Build
        run: |
          cd ledgerly-web
          npm run build

  mobile-ci:
    name: Ledgerly Mobile - Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ledgerly-mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd ledgerly-mobile
          npm ci

      - name: Run Mobile Type Check
        run: |
          cd ledgerly-mobile
          npm run type-check

      - name: Run Mobile Tests
        run: |
          cd ledgerly-mobile
          npm test
